AutoName: Hodos
Summary: Autonomous road condition and hazard mapper
Description: |-
  Hodos turns ordinary daily rides into high-precision road condition maps.
  It runs autonomously in the background without manual button presses,
  vibration distractions, or account logins.

  Features:
  * Self-calibrating road sensing with adaptive noise gating
  * Automatic 250m privacy boundary protection on departure and arrival
  * Pavement roughness (ASTM E1926 IRI) classification
  * GeoJSON and GPX journey export for QGIS and Google Earth
  * 100% open-source under MIT, zero advertising, zero tracking

