name: Android production release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Run unit tests and build debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Enable Linux KVM for Android instrumentation
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo "::warning::KVM missing; Android emulator tests may be unavailable"
          fi
      - name: Test on Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 240
          script: cd apps/web/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Test on Android 15 (API 35)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 240
          script: cd apps/web/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: write
    env:
      HODOS_KEYSTORE_BASE64: ${{ secrets.HODOS_KEYSTORE_BASE64 }}
      HODOS_STORE_PASSWORD: ${{ secrets.HODOS_STORE_PASSWORD }}
      HODOS_KEY_ALIAS: ${{ secrets.HODOS_KEY_ALIAS }}
      HODOS_KEY_PASSWORD: ${{ secrets.HODOS_KEY_PASSWORD }}
      HODOS_SIGNING_CERT_SHA256: ${{ vars.HODOS_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Validate and materialize release signing secret
        shell: bash
        run: |
          set -euo pipefail
          for name in HODOS_KEYSTORE_BASE64 HODOS_STORE_PASSWORD HODOS_KEY_ALIAS HODOS_KEY_PASSWORD HODOS_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required protected release setting is missing: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/hodos-release.keystore"
          printf '%s' "$HODOS_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "HODOS_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Check tag and Gradle version match
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" apps/web/android/app/build.gradle | head -n 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Tag version ($expected) does not match Android versionName ($actual)."
            exit 1
          fi
          echo "version=$expected" >> "$GITHUB_OUTPUT"
      - name: Build production APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify package identity and signing certificate
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="apps/web/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$apk" > "$RUNNER_TEMP/apksigner.txt"
          actual_cert="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "$HODOS_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signing certificate does not match HODOS_SIGNING_CERT_SHA256."
            exit 1
          fi
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='org.hodos.app'" <<< "$badging"
          grep -Fq "versionName='$EXPECTED_VERSION'" <<< "$badging"
          cp "$apk" "$RUNNER_TEMP/Hodos-$EXPECTED_VERSION.apk"
          sha256sum "$RUNNER_TEMP/Hodos-$EXPECTED_VERSION.apk"
          echo "Verified production APK: org.hodos.app $EXPECTED_VERSION"
          echo "Verified signer SHA-256: $actual_cert"
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Hodos ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/Hodos-${{ steps.version.outputs.version }}.apk
