name: CI

on:
  push:
    branches: [main, fix/roadmark-location-reliability]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node --test appwrite/functions/hodos-aggregate/src/main.test.js
      - run: pnpm --filter @hodos/web build
