name: Android APK

on:
  push:
    branches: [main, feat/android-first-native-experience]
    paths:
      - "apps/web/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/web/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build native APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s apps/web/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hodos-android
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK only on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Hodos 1.1.0
          body: |
            Native Android interface with MapLibre and Jetpack Compose.
            Enable location permissions for automatic road mapping.
            This is a debug-signed APK for testing. Keep the same application
            ID; existing installations signed with a different key cannot
            upgrade directly.
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
