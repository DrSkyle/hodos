name: Android verification

on:
  push:
    branches: [main]
    paths:
      - "apps/web/android/**"
      - "apps/web/public/hodos-*.png"
      - "apps/web/public/favicon-32.png"
      - ".github/workflows/android.yml"
      - ".github/workflows/release-android.yml"
  pull_request:
    paths:
      - "apps/web/android/**"
      - "apps/web/public/hodos-*.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Run native unit tests and build debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Enable Linux KVM for Android instrumentation
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM missing; Android emulator tests may be unavailable"
          fi
      - name: Test on Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 240
          script: cd apps/web/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Test on Android 15 (API 35)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 240
          script: cd apps/web/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Verify debug artifact exists
        run: test -s apps/web/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hodos-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
