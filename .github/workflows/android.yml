name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/web/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/web/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HODOS_KEYSTORE_BASE64: ${{ secrets.HODOS_KEYSTORE_BASE64 }}
      HODOS_STORE_PASSWORD: ${{ secrets.HODOS_STORE_PASSWORD }}
      HODOS_KEY_ALIAS: ${{ secrets.HODOS_KEY_ALIAS }}
      HODOS_KEY_PASSWORD: ${{ secrets.HODOS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build native APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Name beta package clearly
        run: |
          test -s apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk Hodos-1.1.4-beta.apk
      - name: Verify APK
        run: test -s Hodos-1.1.4-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hodos-android
          path: Hodos-1.1.4-beta.apk
          if-no-files-found: error
      # Keep release-signing keys in repository Actions secrets, never Git.
      - name: Assemble signed release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HODOS_KEYSTORE_BASE64 != '' && env.HODOS_STORE_PASSWORD != '' && env.HODOS_KEY_ALIAS != '' && env.HODOS_KEY_PASSWORD != '' }}
        env:
          HODOS_KEYSTORE_BASE64: ${{ secrets.HODOS_KEYSTORE_BASE64 }}
          HODOS_STORE_PASSWORD: ${{ secrets.HODOS_STORE_PASSWORD }}
          HODOS_KEY_ALIAS: ${{ secrets.HODOS_KEY_ALIAS }}
          HODOS_KEY_PASSWORD: ${{ secrets.HODOS_KEY_PASSWORD }}
        run: |
          echo "$HODOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hodos-release.jks"
          chmod 600 "$RUNNER_TEMP/hodos-release.jks"
          cd apps/web/android
          HODOS_KEYSTORE_PATH="$RUNNER_TEMP/hodos-release.jks" ./gradlew :app:assembleRelease --no-daemon
      - name: Give signed APK its Hodos release name
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HODOS_KEYSTORE_BASE64 != '' && env.HODOS_STORE_PASSWORD != '' && env.HODOS_KEY_ALIAS != '' && env.HODOS_KEY_PASSWORD != '' }}
        run: |
          test -s apps/web/android/app/build/outputs/apk/release/app-release.apk
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk Hodos-1.1.4.apk
      - name: Publish signed release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HODOS_KEYSTORE_BASE64 != '' && env.HODOS_STORE_PASSWORD != '' && env.HODOS_KEY_ALIAS != '' && env.HODOS_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4
          name: Hodos 1.1.4
          body: |
            Native onboarding, improved map location with platform fallbacks,
            and clearer location settings recovery.
          files: Hodos-1.1.4.apk
          prerelease: true
      - name: Publish debug-signed beta APK when no release key is configured
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && (env.HODOS_KEYSTORE_BASE64 == '' || env.HODOS_STORE_PASSWORD == '' || env.HODOS_KEY_ALIAS == '' || env.HODOS_KEY_PASSWORD == '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4-beta.1
          name: Hodos 1.1.4 beta
          body: |
            Android beta with native onboarding, permission recovery, and improved location fallback.
            
            **This APK is debug-signed, not a stable production release.**
            It may not install over versions signed with another key; keep a copy
            of any important data before reinstalling. Sensor detection has not
            yet been validated with a labelled multi-device road test.
          files: Hodos-1.1.4-beta.apk
          prerelease: true
