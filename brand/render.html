<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const size = Number(params.get("s") || 512);
      const mode = params.get("mode") || "tile";

      const scale = { glyph: 0.66, splash: 0.5 }[mode] ?? 1;

      async function draw() {
        const source = await (await fetch("icon.svg")).text();
        const doc = new DOMParser().parseFromString(source, "image/svg+xml");
        const svg = doc.documentElement;

        if (mode === "square" || mode === "splash") {
          svg.querySelector("rect.tile")?.setAttribute("rx", "0");
        }
        if (mode === "glyph") {
          svg.querySelector("rect.tile")?.remove();
        }
        if (scale !== 1) {
          const glyph = svg.querySelector("g.glyph");
          const offset = (512 * (1 - scale)) / 2;
          glyph?.setAttribute("transform", `translate(${offset} ${offset}) scale(${scale})`);
        }

        svg.setAttribute("width", String(size));
        svg.setAttribute("height", String(size));
        document.getElementById("stage").appendChild(document.importNode(svg, true));
      }

      draw();
    </script>
  </body>
</html>
