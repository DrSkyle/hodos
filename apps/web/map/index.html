<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8f2" />
  <meta name="description" content="Explore live crowdsourced road hazards, potholes, and roughness. Real road observations verified by commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — The road maps itself" />
  <meta property="og:description" content="Explore real crowdsourced potholes, speed bumps, and road roughness." />
  <meta property="og:image" content="__HODOS_SITE__/hodos-icon.png?v=__HODOS_VERSION__" />
  <link rel="canonical" href="__HODOS_SITE__/map" />
  <!--HODOS-ICONS-->
  <title>Live Map · Hodos</title>
  <style>
    :root {
      --bg: #faf8f2;
      --surface: #fffdf8;
      --soft: #f1ede3;
      --soft-2: #e9e4d8;
      --ink: #1c1a17;
      --muted: #736d61;
      --line: #e4dfd1;
      --accent: #d97706;
      --accent-deep: #b45309;
      --shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141311;
        --surface: #1e1c19;
        --soft: #26231f;
        --soft-2: #322e28;
        --ink: #faf8f2;
        --muted: #a8a093;
        --line: #322e28;
      }
    }
    :root[data-theme="dark"] {
      --bg: #141311;
      --surface: #1e1c19;
      --soft: #26231f;
      --soft-2: #322e28;
      --ink: #faf8f2;
      --muted: #a8a093;
      --line: #322e28;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Overpass Variable", "Overpass", -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .map-header {
      background: var(--bg);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 10;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }
    .brand-group img {
      border-radius: 7px;
      display: block;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-stop {
      color: var(--accent);
    }
    .map-instagram {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .map-instagram:hover {
      background: var(--soft-2);
    }
    .map-instagram-wide {
      display: inline-flex;
    }
    @media (max-width: 1180px) {
      .map-instagram-wide { display: none; }
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--soft);
      border-radius: 999px;
      padding: 9px 16px;
      min-width: 190px;
      max-width: 260px;
      flex: 1;
    }
    .search-box svg {
      width: 14px;
      height: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .search-box input {
      border: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      width: 100%;
      outline: none;
    }
    .search-box input::placeholder {
      color: var(--muted);
    }
    .nav-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .filter-chip {
      background: var(--soft);
      border: 0;
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .filter-chip:hover {
      background: var(--soft-2);
    }
    .filter-chip.active {
      background: var(--ink);
      color: var(--surface);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: var(--soft);
      border: 0;
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .btn-action:hover {
      background: var(--soft-2);
    }
    .map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }
    #full-map {
      flex: 1;
      height: 100%;
      width: 100%;
    }
    .map-status-floating {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--surface);
      padding: 9px 16px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      font-family: "Overpass Mono Variable", "Overpass Mono", ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      z-index: 5;
    }
    .map-legend-floating {
      position: absolute;
      bottom: 24px;
      left: 16px;
      background: var(--surface);
      padding: 14px 18px 16px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      color: var(--ink);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .legend-title {
      font-family: "Overpass Mono Variable", "Overpass Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Overpass Mono Variable", "Overpass Mono", ui-monospace, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-police { background: #2563eb; }
    .dot-jam { background: #ea580c; }
    .dot-roadblock { background: #dc2626; }
    .dot-flood { background: #0891b2; }
    .dot-pothole { background: #e11d48; }
    .dot-rough { background: #d97706; }
    .dot-bump { background: #7c3aed; }
    .dot-fixed { background: var(--surface); border: 3px solid #10b981; width: 12px; height: 12px; }
    .radar-dock {
      position: absolute;
      bottom: 24px;
      right: 16px;
      background: var(--surface);
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      color: var(--ink);
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(360px, calc(100vw - 32px));
    }
    .radar-dock-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .radar-dock-title {
      font-family: "Overpass Mono Variable", "Overpass Mono", ui-monospace, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .radar-dock-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .radar-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 0;
      background: var(--soft);
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .radar-btn:hover:not(:disabled) {
      background: var(--soft-2);
      transform: translateY(-1px);
    }
    .radar-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .radar-feedback {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }
    .btn-sponsor {
      background: var(--accent);
      border: 0;
      color: #ffffff;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 9px 17px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .btn-sponsor:hover {
      background: var(--accent-deep);
    }
    @media (max-width: 720px) {
      .map-legend-floating { display: none; }
      .radar-dock { left: 12px; right: 12px; bottom: 16px; max-width: none; }
    }
  </style>
</head>
<body>
  <header class="map-header">
    <a href="/" class="brand-group" aria-label="Return to Hodos Home">
      <img src="/hodos-icon.png?v=__HODOS_VERSION__" alt="Hodos" width="32" height="32" />
      <span class="brand-title">hodos<span class="brand-stop">.</span></span>
    </a>
    <a href="/app/" class="map-instagram">Web app</a>
    <a href="/garage" class="map-instagram">Garage</a>
    <a href="__HODOS_INSTAGRAM__" target="_blank" rel="noopener noreferrer" class="map-instagram map-instagram-wide" aria-label="Follow @minerva__corporation on Instagram">Follow @minerva__corporation</a>

    <label class="search-box" aria-label="Filter observations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="map-search-input" type="search" placeholder="Filter by type or coordinate…" autocomplete="off" />
    </label>

    <div class="nav-chips" role="toolbar" aria-label="Hazard category filters">
      <button class="filter-chip active" data-kind="all">All</button>
      <button class="filter-chip" data-kind="alerts">Live radar</button>
      <button class="filter-chip" data-kind="police">Police</button>
      <button class="filter-chip" data-kind="jam">Jam</button>
      <button class="filter-chip" data-kind="roadblock">Blocked</button>
      <button class="filter-chip" data-kind="flood">Flood</button>
      <button class="filter-chip" data-kind="pothole">Potholes</button>
      <button class="filter-chip" data-kind="rough_pavement">Rough road</button>
      <button class="filter-chip" data-kind="speed_bump">Speed bumps</button>
      <button class="filter-chip" data-kind="fixed">Repaired</button>
    </div>

    <div class="action-group">
      <button id="theme-toggle" type="button" class="btn-action" aria-label="Toggle dark mode">☾ Dark</button>
      <a href="/partners" class="btn-sponsor">Put your shop here</a>
      <button id="btn-fit-all" class="btn-action">Fit route</button>
      <a href="/" class="btn-action">← Back</a>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="full-map" aria-label="Interactive road hazard map"></div>
    <div id="full-map-status" class="map-status-floating">Loading road map...</div>

    <div class="map-legend-floating">
      <span class="legend-title">Live radar</span>
      <div class="legend-row"><span class="legend-dot dot-police"></span><span>Police check</span></div>
      <div class="legend-row"><span class="legend-dot dot-jam"></span><span>Traffic jam</span></div>
      <div class="legend-row"><span class="legend-dot dot-roadblock"></span><span>Roadblock</span></div>
      <div class="legend-row"><span class="legend-dot dot-flood"></span><span>Flooded</span></div>
      <span class="legend-title" style="margin-top:4px;">Road surface</span>
      <div class="legend-row"><span class="legend-dot dot-pothole"></span><span>Pothole</span></div>
      <div class="legend-row"><span class="legend-dot dot-rough"></span><span>Rough road</span></div>
      <div class="legend-row"><span class="legend-dot dot-bump"></span><span>Speed bump</span></div>
      <div class="legend-row"><span class="legend-dot dot-fixed"></span><span>Repaired</span></div>
    </div>

    <section class="radar-dock" aria-label="Report a live road alert">
      <div class="radar-dock-head">
        <span class="radar-dock-title">1-tap road radar</span>
      </div>
      <div class="radar-dock-buttons">
        <button type="button" class="radar-btn" data-alert="police"><span class="legend-dot dot-police"></span>Police</button>
        <button type="button" class="radar-btn" data-alert="jam"><span class="legend-dot dot-jam"></span>Jam</button>
        <button type="button" class="radar-btn" data-alert="roadblock"><span class="legend-dot dot-roadblock"></span>Blocked</button>
        <button type="button" class="radar-btn" data-alert="flood"><span class="legend-dot dot-flood"></span>Flood</button>
      </div>
      <p id="radar-feedback" class="radar-feedback">Tap to warn drivers on this road. Uses GPS if allowed, or map center.</p>
    </section>

  </main>

  <script type="module" src="/src/map-page.ts"></script>
</body>
</html>
