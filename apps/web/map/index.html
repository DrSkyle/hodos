<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="description" content="Explore live crowdsourced road hazards, potholes, and roughness. Real road observations verified by commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — Real Road Defect Intelligence" />
  <meta property="og:description" content="Explore real crowdsourced potholes, speed bumps, and road roughness. Free GeoJSON/GPX downloads." />
  <meta property="og:image" content="https://hodos.devilabs.dev/hodos-icon.png" />
  <link rel="canonical" href="https://hodos.devilabs.dev/map" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.2.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1.2.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=1.2.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.2.0" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/telemetry.css" />

  <title>Live Road Hazards · Hodos</title>
  <style>
    :root {
      --bg: #0B0E14;
      --surface: #111622;
      --surface-elevated: #182030;
      --border: #1E293B;
      --text: #E2E8F0;
      --text-bright: #F8FAFC;
      --text-muted: #94A3B8;
      --coral: #DE3618;
      --coral-bright: #FF6647;
      --coral-subtle: rgba(255, 102, 71, 0.12);
      --amber: #F59E0B;
      --cyan: #38BDF8;
      --emerald: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-header {
      background: rgba(17, 22, 34, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-bright);
    }
    .brand-icon {
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      text-transform: uppercase;
      font-weight: 600;
      background: var(--coral-subtle);
      color: var(--coral-bright);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 102, 71, 0.25);
    }
    .nav-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .filter-chip {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 99px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }
    .filter-chip:hover {
      background: #1E293B;
      color: var(--text-bright);
    }
    .filter-chip.active {
      background: var(--coral);
      color: #FFFFFF;
      border-color: var(--coral);
      font-weight: 700;
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .btn-action {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .btn-action:hover {
      background: var(--surface-elevated);
      border-color: var(--text-muted);
    }
    .btn-primary-action {
      background: var(--coral);
      color: #FFFFFF;
      border-color: var(--coral);
    }
    .btn-primary-action:hover {
      background: #C52D12;
    }
    .map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }
    #full-map {
      flex: 1;
      height: 100%;
      width: 100%;
    }
    .map-status-floating {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(17, 22, 34, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .map-legend-floating {
      position: absolute;
      bottom: 24px;
      left: 14px;
      background: rgba(17, 22, 34, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.75rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 280px;
    }
    .legend-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: var(--text-bright);
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-pothole { background: var(--coral-bright); }
    .dot-rough { background: var(--amber); }
    .dot-bump { background: var(--cyan); }
    .dot-fixed { background: var(--emerald); }

    /* Defect Explorer Drawer */
    .defect-drawer {
      width: 340px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.5);
    }
    .defect-drawer.hidden {
      transform: translateX(100%);
      display: none;
    }
    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-elevated);
    }
    .drawer-title {
      font-family: 'Outfit', sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--text-bright);
    }
    .drawer-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .drawer-search input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-bright);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .drawer-search input:focus {
      border-color: var(--coral-bright);
    }
    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .defect-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .defect-item:hover {
      border-color: var(--coral-bright);
      transform: translateY(-1px);
    }
    .defect-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .defect-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .defect-coords {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }
    .defect-meta {
      font-size: 0.6875rem;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header class="map-header">
    <a href="/" class="brand-group" aria-label="Return to Hodos Home">
      <img class="brand-icon" src="/hodos-icon.png" alt="Hodos" width="34" height="34" />
      <div>
        <div class="brand-title">HODOS</div>
      </div>
      <span class="brand-tag">ROAD TELEMETRY</span>
    </a>

    <div class="nav-chips" role="toolbar" aria-label="Hazard category filters">
      <button class="filter-chip active" data-kind="all">All (438)</button>
      <button class="filter-chip" data-kind="pothole">Potholes (108)</button>
      <button class="filter-chip" data-kind="rough_pavement">Rough Road (318)</button>
      <button class="filter-chip" data-kind="speed_bump">Speed Bumps (12)</button>
      <button class="filter-chip" data-kind="fixed">Repaired</button>
    </div>

    <div class="action-group">
      <button id="btn-fit-all" class="btn-action" title="Fit all recorded data on map">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        <span>Fit Route</span>
      </button>
      <button id="btn-toggle-drawer" class="btn-action" title="Toggle defect explorer list">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>Defect List</span>
      </button>
      <button id="btn-export-geojson" class="btn-action" title="Export GeoJSON of current map">Download GeoJSON</button>
      <button id="btn-export-gpx" class="btn-action" title="Export GPX waypoint file">Download GPX</button>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="full-map" aria-label="Interactive road hazard map"></div>
    <div id="full-map-status" class="map-status-floating">Connecting to real road observations...</div>
    <div class="map-legend-floating">
      <div class="legend-title">Hazard Telemetry</div>
      <div class="legend-row"><span class="legend-dot dot-pothole"></span><span>Pothole (Severe / Moderate)</span></div>
      <div class="legend-row"><span class="legend-dot dot-rough"></span><span>Rough Pavement Rutting</span></div>
      <div class="legend-row"><span class="legend-dot dot-bump"></span><span>Speed Bump / Hump</span></div>
      <div class="legend-row"><span class="legend-dot dot-fixed"></span><span>Verified Repaired</span></div>
    </div>

    <aside id="defect-drawer" class="defect-drawer">
      <div class="drawer-header">
        <span class="drawer-title">Real Defect Observations</span>
        <button id="btn-close-drawer" style="border:none; background:transparent; cursor:pointer; font-size:18px; color:#94A3B8;">&times;</button>
      </div>
      <div class="drawer-search">
        <input type="text" id="defect-search" placeholder="Filter by GPS coordinate or category..." />
      </div>
      <div id="drawer-list" class="drawer-list">
        <div style="padding:16px; text-align:center; color:#94A3B8; font-size:12px;">Loading defect observations...</div>
      </div>
    </aside>
  </main>

  <script type="module" src="/src/map-page.ts"></script>

</body>
</html>
