<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#193d32" />
  <meta name="description" content="Explore live crowdsourced road hazards, potholes, and roughness. Real road observations verified by commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — The road maps itself" />
  <meta property="og:description" content="Explore real crowdsourced potholes, speed bumps, and road roughness. Free GeoJSON and GPX export." />
  <meta property="og:image" content="https://hodos.devilabs.dev/hodos-icon.png?v=2.0.0" />
  <link rel="canonical" href="https://hodos.devilabs.dev/map" />
  <link rel="icon" href="/brandmark.svg?v=2.0.0" type="image/svg+xml" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2.0.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2.0.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2.0.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2.0.0" />
  <link rel="manifest" href="/site.webmanifest?v=2.0.0" />

  <title>Live Road Defect Telemetry · Hodos</title>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-background text-foreground antialiased select-none">
  <!-- Cartographic Map Header -->
  <header class="h-14 border-b border-border bg-background/95 backdrop-blur px-4 flex items-center justify-between gap-4 z-20 shrink-0">
    <div class="flex items-center gap-3 shrink-0">
      <a href="/" class="btn btn-ghost btn-sm gap-1.5 px-2" aria-label="Back to home">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="hidden sm:inline font-medium">Home</span>
      </a>
      <div class="h-4 w-px bg-border"></div>
      <a href="/" class="flex items-center gap-2 shrink-0" aria-label="Hodos home">
        <img src="/hodos-icon.png?v=2.0.0" alt="Hodos" class="w-7 h-7 rounded-lg object-cover shadow-2xs" width="28" height="28" />
        <span class="font-extrabold tracking-tight text-base">hodos<span class="text-[#d68454] font-black">.</span></span>
      </a>
      <span class="badge badge-secondary text-xs whitespace-nowrap hidden xl:inline-flex">Live Defect Map</span>
    </div>

    <!-- Category filter buttons (shadcn tab style) -->
    <div class="tabs-list hidden lg:inline-flex" role="toolbar" aria-label="Hazard category filters">
      <button class="tabs-trigger active" data-kind="all">All (438)</button>
      <button class="tabs-trigger" data-kind="pothole">Potholes (108)</button>
      <button class="tabs-trigger" data-kind="rough_pavement">Rough Road (318)</button>
      <button class="tabs-trigger" data-kind="speed_bump">Speed Bumps (12)</button>
      <button class="tabs-trigger" data-kind="fixed">Repaired</button>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-1.5">
      <button id="btn-fit-all" class="btn btn-outline btn-sm gap-1.5" title="Fit all hazards on map">
        <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Fit Route</span>
      </button>

      <button id="btn-toggle-drawer" class="btn btn-outline btn-sm gap-1.5" title="Toggle defect explorer drawer">
        <i data-lucide="list" class="w-3.5 h-3.5"></i>
        <span>Defects</span>
      </button>

      <button id="btn-export-geojson" class="btn btn-outline btn-sm gap-1.5 hidden sm:inline-flex" title="Export GeoJSON">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>GeoJSON</span>
      </button>

      <button id="btn-export-gpx" class="btn btn-outline btn-sm gap-1.5 hidden md:inline-flex" title="Export GPX">
        <i data-lucide="file-code" class="w-3.5 h-3.5"></i>
        <span>GPX</span>
      </button>

      <div class="h-4 w-px bg-border mx-1"></div>

      <!-- Theme Toggle -->
      <button id="theme-toggle" class="btn btn-ghost btn-icon h-8 w-8" aria-label="Toggle theme">
        <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 hidden dark:inline"></i>
      </button>
    </div>
  </header>

  <!-- Mobile filter bar -->
  <div class="lg:hidden flex items-center gap-1 overflow-x-auto px-3 py-1.5 border-b border-border bg-muted/40 shrink-0">
    <button class="tabs-trigger text-xs py-1 px-2.5 active" data-kind="all">All (438)</button>
    <button class="tabs-trigger text-xs py-1 px-2.5" data-kind="pothole">Potholes (108)</button>
    <button class="tabs-trigger text-xs py-1 px-2.5" data-kind="rough_pavement">Rough Road (318)</button>
    <button class="tabs-trigger text-xs py-1 px-2.5" data-kind="speed_bump">Speed Bumps (12)</button>
    <button class="tabs-trigger text-xs py-1 px-2.5" data-kind="fixed">Repaired</button>
  </div>

  <!-- Map Container -->
  <main class="relative flex-1 w-full h-full overflow-hidden select-text">
    <div id="full-map" class="w-full h-full"></div>

    <!-- Floating status pill -->
    <div id="full-map-status" class="absolute top-3 left-3 card px-3 py-1.5 text-xs font-mono text-muted-foreground flex items-center gap-2 shadow-md backdrop-blur bg-background/90 z-10">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span>Connecting to road observations...</span>
    </div>

    <!-- Floating Legend Card -->
    <div class="absolute bottom-6 left-3 card p-3 shadow-lg backdrop-blur bg-card/95 z-10 max-w-[260px] text-xs">
      <div class="font-semibold tracking-tight text-foreground mb-2 flex items-center justify-between">
        <span>Defect Telemetry</span>
        <span class="badge badge-outline text-[10px] py-0 px-1.5">v1.2.0</span>
      </div>
      <div class="space-y-1.5 text-muted-foreground">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500 ring-2 ring-red-500/20 shrink-0"></span>
          <span class="text-foreground">Pothole (Severe / Moderate)</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 ring-2 ring-amber-500/20 shrink-0"></span>
          <span>Rough Pavement Rutting</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-500 ring-2 ring-sky-500/20 shrink-0"></span>
          <span>Speed Bump / Hump</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-emerald-500/20 shrink-0"></span>
          <span>Verified Repaired</span>
        </div>
      </div>
    </div>

    <!-- Defect Explorer Drawer (Shadcn Sheet) -->
    <aside id="defect-drawer" class="sheet w-80 sm:w-96 hidden">
      <div class="p-4 border-b border-border flex items-center justify-between bg-card">
        <div>
          <h2 class="font-semibold text-sm">Road Defect Observations</h2>
          <p class="text-xs text-muted-foreground">438 field pilot &amp; corroborated readings</p>
        </div>
        <button id="btn-close-drawer" class="btn btn-ghost btn-icon h-7 w-7" aria-label="Close sheet">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-3 border-b border-border bg-background">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-muted-foreground pointer-events-none"></i>
          <input type="text" id="defect-search" class="input pl-9 text-xs" placeholder="Filter by coordinate or type..." />
        </div>
      </div>

      <div id="drawer-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        <div class="p-6 text-center text-xs text-muted-foreground">Loading defect observations...</div>
      </div>
    </aside>
  </main>

  <script type="module" src="/src/map-page.ts"></script>
</body>
</html>
