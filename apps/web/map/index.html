<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf1f3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&display=swap" />
  <meta name="description" content="Explore live crowdsourced road hazards, potholes, and roughness. Real road observations verified by commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — The road maps itself" />
  <meta property="og:description" content="Explore real crowdsourced potholes, speed bumps, and road roughness." />
  <meta property="og:image" content="__HODOS_SITE__/hodos-icon.png?v=__HODOS_VERSION__" />
  <link rel="canonical" href="__HODOS_SITE__/map" />
  <!--HODOS-ICONS-->
  <title>Live Map · Hodos</title>
</head>
<body class="map-body">
  <header class="site-nav map-nav">
    <div class="nav-inner map-nav-inner">
      <a class="nav-brand" href="/" aria-label="Hodos home">
        <img src="/hodos-icon.png?v=__HODOS_VERSION__" alt="" width="26" height="26" />
        <span>hodos<span class="dot">.</span></span>
      </a>

      <label class="map-search" aria-label="Filter observations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="map-search-input" type="search" placeholder="Filter roads or coordinates…" autocomplete="off" />
      </label>

      <div class="map-actions">
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle dark mode">☾</button>
        <a href="/partners" class="btn btn-accent btn-compact">List a shop</a>
        <button id="btn-fit-all" class="btn btn-ghost btn-compact">Fit</button>
        <a href="/" class="btn btn-ghost btn-compact map-home">Home</a>
      </div>
    </div>

    <div class="filter-bar" role="toolbar" aria-label="Hazard category filters">
      <button class="chip is-active" data-kind="all" aria-pressed="true">All</button>
      <button class="chip" data-kind="alerts" aria-pressed="false">Live radar</button>
      <button class="chip" data-kind="pothole" aria-pressed="false">Potholes</button>
      <button class="chip" data-kind="rough_pavement" aria-pressed="false">Rough road</button>
      <button class="chip" data-kind="speed_bump" aria-pressed="false">Speed bumps</button>
      <button class="chip" data-kind="fixed" aria-pressed="false">Repaired</button>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="full-map" aria-label="Interactive road hazard map"></div>
    <div id="full-map-status" class="map-status">Loading the road map…</div>

    <details class="map-legend" aria-label="Map legend">
      <summary>Legend</summary>
      <span class="map-legend-title">Live radar</span>
      <div class="legend-row"><span class="radar-symbol sym-police">P</span>Police check</div>
      <div class="legend-row"><span class="radar-symbol sym-jam">!</span>Traffic jam</div>
      <div class="legend-row"><span class="radar-symbol sym-roadblock">✕</span>Roadblock</div>
      <div class="legend-row"><span class="radar-symbol sym-flood">≈</span>Flooded</div>
      <span class="map-legend-title">Road surface</span>
      <div class="legend-row"><span class="legend-dot dot-pothole"></span>Pothole</div>
      <div class="legend-row"><span class="legend-dot dot-rough"></span>Rough road</div>
      <div class="legend-row"><span class="legend-dot dot-bump"></span>Speed bump</div>
      <div class="legend-row"><span class="legend-dot dot-fixed"></span>Repaired</div>
    </details>

    <section class="radar-dock" aria-label="Live road radar feed and 1-tap reporting">
      <span class="radar-dock-title">Live road feed · 1-tap report</span>
      <div class="radar-dock-buttons">
        <button type="button" class="chip radar-btn" data-alert="police"><span class="radar-symbol sym-police">P</span>Police</button>
        <button type="button" class="chip radar-btn" data-alert="jam"><span class="radar-symbol sym-jam">!</span>Jam</button>
        <button type="button" class="chip radar-btn" data-alert="roadblock"><span class="radar-symbol sym-roadblock">✕</span>Blocked</button>
        <button type="button" class="chip radar-btn" data-alert="flood"><span class="radar-symbol sym-flood">≈</span>Flood</button>
      </div>
      <p id="radar-feedback" class="radar-feedback">Tap to warn drivers on this road. Temporary alerts auto-expire.</p>
      <div id="radar-feed" class="radar-feed" aria-label="Active temporary road alerts"></div>
    </section>
  </main>

  <script type="module" src="/src/map-page.ts"></script>
</body>
</html>
