<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111417" />
  <meta name="description" content="Explore live crowdsourced road hazards globally. Real potholes, speed humps, and surface roughness verified across transport networks." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — Global Road Hazard Intelligence" />
  <meta property="og:description" content="Explore crowdsourced potholes, speed humps, and road roughness. Free GeoJSON and GPX downloads." />
  <meta property="og:image" content="https://hodos.devilabs.dev/hodos-icon.png" />
  <link rel="canonical" href="https://hodos.devilabs.dev/map" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.2.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1.2.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=1.2.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.2.0" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <title>Global Defect Map · Hodos</title>
</head>
<body class="map-layout-body">
  <!-- Milestone Control Masthead -->
  <header class="map-control-masthead">
    <div class="map-brand-wrap">
      <a class="brand-monolith" href="/" aria-label="Hodos Home">
        <div class="brand-icon-frame" style="width: 34px; height: 34px;">
          <img src="/hodos-icon.png" alt="Hodos" width="34" height="34" />
        </div>
        <div class="brand-text-stack">
          <span class="brand-title" style="font-size: 20px;">HODOS</span>
          <span class="brand-route-badge">GLOBAL ROAD MAP</span>
        </div>
      </a>
      <span class="map-route-pill" id="full-map-status">438 HAZARDS MAPPED</span>
    </div>

    <!-- Filter Chips in Milestone Stone Style -->
    <div class="map-filter-group" aria-label="Hazard category filters">
      <button class="filter-milestone-chip active" data-kind="all">All (438)</button>
      <button class="filter-milestone-chip" data-kind="pothole" style="border-left: 3px solid var(--survey-red);">Potholes (108)</button>
      <button class="filter-milestone-chip" data-kind="rough_pavement" style="border-left: 3px solid var(--rough-amber);">Rough Road (318)</button>
      <button class="filter-milestone-chip" data-kind="speed_bump" style="border-left: 3px solid var(--control-cobalt);">Speed Humps (12)</button>
      <button class="filter-milestone-chip" data-kind="fixed" style="border-left: 3px solid var(--fixed-green);">Repaired</button>
    </div>

    <!-- Actions & Data Export -->
    <div class="map-actions-group">
      <button class="btn-map-utility accent" id="btn-toggle-drawer" title="Toggle Defect Ledger Drawer">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <span>Ledger</span>
      </button>
      <button class="btn-map-utility" id="btn-fit-all" title="Fit all defects into view">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Recenter</span>
      </button>
      <button class="btn-map-utility" id="btn-export-geojson" title="Download GeoJSON format">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>GeoJSON</span>
      </button>
      <button class="btn-map-utility" id="btn-export-gpx" title="Download GPX format">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>GPX</span>
      </button>
      <a class="btn-map-utility" href="/" style="background: var(--dark-asphalt); color: #fff; border-color: var(--dark-asphalt);">
        <span>Exit Map</span>
      </a>
    </div>
  </header>

  <!-- Map Frame & Container -->
  <div class="map-container-frame">
    <div id="full-map" style="width: 100%; height: 100%;"></div>

    <!-- Defect Ledger Drawer -->
    <aside class="defect-ledger-drawer" id="defect-drawer" aria-label="Defect Ledger Drawer">
      <div class="drawer-top-banner">
        <span class="drawer-title-label">HIGHWAY DEFECT LEDGER</span>
        <button id="btn-close-drawer" style="color: #FFFFFF; font-size: 16px; padding: 2px 6px; cursor: pointer;" aria-label="Close drawer">✕</button>
      </div>

      <div class="drawer-search-bar">
        <input
          type="text"
          id="defect-search"
          class="drawer-search-input"
          placeholder="Filter by coordinates, kind, or tier..."
          aria-label="Filter road defects"
        />
      </div>

      <div class="drawer-items-scroll" id="drawer-list">
        <div style="padding: 24px; text-align: center; color: var(--ink-muted); font-size: 12.5px; font-family: var(--font-mono);">
          Loading defect ledger...
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="/src/map-page.ts"></script>
</body>
</html>
