<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#172d29" />
  <meta name="description" content="Explore live crowdsourced road hazards, potholes, and roughness. Real road observations verified by commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — The road maps itself" />
  <meta property="og:description" content="Explore real crowdsourced potholes, speed bumps, and road roughness." />
  <meta property="og:image" content="https://hodos.devilabs.dev/hodos-icon.png?v=2.0.1" />
  <link rel="canonical" href="https://hodos.devilabs.dev/map" />
  <link rel="icon" href="/brandmark.svg?v=2.0.1" type="image/svg+xml" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2.0.1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2.0.1" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2.0.1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2.0.1" />
  <link rel="manifest" href="/site.webmanifest?v=2.0.1" />
  <title>Live Map · Hodos</title>
  <style>
    :root {
      --paper: #f7f6ef;
      --surface: #fffdf7;
      --ink: #172d29;
      --fern: #438168;
      --muted: #586e63;
      --line: #d9e0d7;
      --accent: #d68454;
      --shadow: 0 8px 24px rgba(23, 45, 41, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .map-header {
      background: rgba(247, 246, 239, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 10;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }
    .brand-group img {
      border-radius: 10px;
      display: block;
    }
    .brand-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.06em;
    }
    .brand-stop {
      color: var(--accent);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 6px 14px;
      min-width: 210px;
      max-width: 280px;
      flex: 1;
    }
    .search-box svg {
      width: 14px;
      height: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .search-box input {
      border: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      width: 100%;
      outline: none;
    }
    .search-box input::placeholder {
      color: var(--muted);
    }
    .nav-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 99px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .filter-chip:hover {
      border-color: #8aaa97;
    }
    .filter-chip.active {
      background: var(--ink);
      color: var(--surface);
      border-color: var(--ink);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 9px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #e9efe7;
    }
    .map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }
    #full-map {
      flex: 1;
      height: 100%;
      width: 100%;
    }
    .map-status-floating {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255, 253, 247, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: var(--shadow);
      z-index: 5;
    }
    .map-legend-floating {
      position: absolute;
      bottom: 24px;
      left: 14px;
      background: rgba(255, 253, 247, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: var(--shadow);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-pothole { background: #c95b3c; }
    .dot-rough { background: #d68454; }
    .dot-bump { background: #3b76a8; }
    .dot-fixed { background: #367b62; }
  </style>
</head>
<body>
  <header class="map-header">
    <a href="/" class="brand-group" aria-label="Return to Hodos Home">
      <img src="/hodos-icon.png?v=2.0.1" alt="Hodos" width="34" height="34" />
      <span class="brand-title">hodos<span class="brand-stop">.</span></span>
    </a>

    <label class="search-box" aria-label="Filter observations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="map-search-input" type="search" placeholder="Filter by type or coordinate…" autocomplete="off" />
    </label>

    <div class="nav-chips" role="toolbar" aria-label="Hazard category filters">
      <button class="filter-chip active" data-kind="all">All</button>
      <button class="filter-chip" data-kind="pothole">Potholes</button>
      <button class="filter-chip" data-kind="rough_pavement">Rough road</button>
      <button class="filter-chip" data-kind="speed_bump">Speed bumps</button>
      <button class="filter-chip" data-kind="fixed">Repaired</button>
    </div>

    <div class="action-group">
      <button id="btn-fit-all" class="btn-action">Fit route</button>
      <a href="/" class="btn-action">← Back</a>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="full-map" aria-label="Interactive road hazard map"></div>
    <div id="full-map-status" class="map-status-floating">Loading road map...</div>
    <div class="map-legend-floating">
      <div class="legend-row"><span class="legend-dot dot-pothole"></span><span>Pothole</span></div>
      <div class="legend-row"><span class="legend-dot dot-rough"></span><span>Rough road</span></div>
      <div class="legend-row"><span class="legend-dot dot-bump"></span><span>Speed bump</span></div>
      <div class="legend-row"><span class="legend-dot dot-fixed"></span><span>Repaired</span></div>
    </div>
  </main>

  <script type="module" src="/src/map-page.ts"></script>
</body>
</html>
