<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfbfd" />
  <meta name="description" content="Explore live crowdsourced road hazards, potholes, and roughness. Real road observations verified by commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hodos Live Map — The road maps itself" />
  <meta property="og:description" content="Explore real crowdsourced potholes, speed bumps, and road roughness." />
  <meta property="og:image" content="https://hodos.devilabs.dev/hodos-icon.png?v=2.0.2" />
  <link rel="canonical" href="https://hodos.devilabs.dev/map" />
  <link rel="icon" href="/brandmark.svg?v=2.0.2" type="image/svg+xml" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2.0.2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2.0.2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2.0.2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2.0.2" />
  <link rel="manifest" href="/site.webmanifest?v=2.0.2" />
  <title>Live Map · Hodos</title>
  <style>
    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --ink: #1d1d1f;
      --muted: #86868b;
      --line: rgba(0, 0, 0, 0.08);
      --accent: #d97706;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .map-header {
      background: rgba(251, 251, 253, 0.84);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 10;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }
    .brand-group img {
      border-radius: 9px;
      display: block;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .brand-stop {
      color: var(--accent);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 980px;
      padding: 7px 14px;
      min-width: 210px;
      max-width: 280px;
      flex: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .search-box svg {
      width: 14px;
      height: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .search-box input {
      border: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      width: 100%;
      outline: none;
    }
    .search-box input::placeholder {
      color: var(--muted);
    }
    .nav-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 980px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-chip:hover {
      border-color: rgba(0, 0, 0, 0.22);
    }
    .filter-chip.active {
      background: var(--ink);
      color: var(--surface);
      border-color: var(--ink);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 980px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: #f5f5f7;
    }
    .map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }
    #full-map {
      flex: 1;
      height: 100%;
      width: 100%;
    }
    .map-status-floating {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: var(--shadow);
      z-index: 5;
    }
    .map-legend-floating {
      position: absolute;
      bottom: 24px;
      left: 16px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border: 1px solid var(--line);
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      box-shadow: var(--shadow);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-pothole { background: #e11d48; }
    .dot-rough { background: #d97706; }
    .dot-bump { background: #7c3aed; }
    .dot-fixed { background: #10b981; }
    .btn-sponsor {
      background: rgba(217, 119, 6, 0.12);
      border: 1px solid rgba(217, 119, 6, 0.28);
      color: #b45309;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 980px;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .btn-sponsor:hover {
      background: #d97706;
      color: #ffffff;
    }
    .map-ad-floating {
      position: absolute;
      bottom: 24px;
      right: 16px;
      max-width: 310px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border: 1px solid var(--line);
      padding: 14px 16px;
      border-radius: 16px;
      color: var(--ink);
      box-shadow: var(--shadow);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .map-ad-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .map-ad-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #b45309;
      background: rgba(217, 119, 6, 0.12);
      padding: 3px 8px;
      border-radius: 980px;
    }
    .map-ad-cta {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .map-ad-cta:hover {
      text-decoration: underline;
    }
    .map-ad-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }
    .map-ad-sub {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    @media (max-width: 680px) {
      .map-ad-floating {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="map-header">
    <a href="/" class="brand-group" aria-label="Return to Hodos Home">
      <img src="/hodos-icon.png?v=2.0.2" alt="Hodos" width="32" height="32" />
      <span class="brand-title">hodos<span class="brand-stop">.</span></span>
    </a>

    <label class="search-box" aria-label="Filter observations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="map-search-input" type="search" placeholder="Filter by type or coordinate…" autocomplete="off" />
    </label>

    <div class="nav-chips" role="toolbar" aria-label="Hazard category filters">
      <button class="filter-chip active" data-kind="all">All</button>
      <button class="filter-chip" data-kind="pothole">Potholes</button>
      <button class="filter-chip" data-kind="rough_pavement">Rough road</button>
      <button class="filter-chip" data-kind="speed_bump">Speed bumps</button>
      <button class="filter-chip" data-kind="fixed">Repaired</button>
    </div>

    <div class="action-group">
      <a href="/#pricing" class="btn-sponsor">Sponsor a Pit-Stop</a>
      <button id="btn-fit-all" class="btn-action">Fit route</button>
      <a href="/" class="btn-action">← Back</a>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="full-map" aria-label="Interactive road hazard map"></div>
    <div id="full-map-status" class="map-status-floating">Loading road map...</div>
    <div class="map-legend-floating">
      <div class="legend-row"><span class="legend-dot dot-pothole"></span><span>Pothole</span></div>
      <div class="legend-row"><span class="legend-dot dot-rough"></span><span>Rough road</span></div>
      <div class="legend-row"><span class="legend-dot dot-bump"></span><span>Speed bump</span></div>
      <div class="legend-row"><span class="legend-dot dot-fixed"></span><span>Repaired</span></div>
    </div>
    <aside class="map-ad-floating" aria-label="Sponsored Driver Perk">
      <div class="map-ad-top">
        <span class="map-ad-badge">Sponsored Pit-Stop</span>
        <a href="mailto:hodos@devilabs.dev?subject=Hodos%20Pit-Stop%20Sponsorship" class="map-ad-cta">Place your shop →</a>
      </div>
      <div class="map-ad-title">15% off suspension, tire &amp; oil service for Pathao &amp; inDrive riders</div>
      <div class="map-ad-sub">Show your active Hodos journey counter at partner garages. Ads keep the live map 100% free.</div>
    </aside>
  </main>

  <script type="module" src="/src/map-page.ts"></script>
</body>
</html>
