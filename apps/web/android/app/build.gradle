plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing is intentionally secret-only. There is no committed-key or
// debug-key fallback: a release must fail closed when its signing material is
// not explicitly provided by the protected release environment.
def releaseKeystorePath = System.getenv('HODOS_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('HODOS_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('HODOS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('HODOS_KEY_PASSWORD')
def releaseStoreType = System.getenv('HODOS_STORE_TYPE')

android {
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                if (releaseStoreType?.trim()) {
                    storeType releaseStoreType.trim()
                }
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    namespace 'org.hodos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.hodos.app'
        minSdk 23
        targetSdk 35
        versionCode 29
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        // Let the Android Gradle Plugin manage the standard local debug key.
        // A developer-specific debug keystore must never be committed.
        debug {
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

// Fail with a useful error before Gradle attempts release signing. This task
// is not part of debug builds, so contributors can still run the full test
// and debug-install workflow without access to production secrets.
tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Validates protected release-signing inputs.'
    doLast {
        def required = [
            HODOS_KEYSTORE_PATH: releaseKeystorePath,
            HODOS_STORE_PASSWORD: releaseStorePassword,
            HODOS_KEY_ALIAS: releaseKeyAlias,
            HODOS_KEY_PASSWORD: releaseKeyPassword
        ]
        def missing = required.findAll { name, value -> !value?.trim() }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Release signing is not configured. Missing environment variables: ${missing.join(', ')}"
            )
        }
        def keystore = file(releaseKeystorePath)
        if (!keystore.isFile() || keystore.length() == 0) {
            throw new GradleException("Release keystore does not exist or is empty: ${keystore}")
        }
    }
}

tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    dependsOn tasks.named('validateReleaseSigning')
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // OS-managed, network-constrained retries outlive the sensor service.
    implementation 'androidx.work:work-runtime:2.9.1'
    // 12.x uses the mature OpenGL renderer; pin for older-phone compatibility.
    implementation 'org.maplibre.gl:android-sdk:12.3.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Hodos has exactly ONE full-colour brand image: web/public/hodos-icon.png.
// The website favicon is a pixel-exact 32px resize of this same source.
// Both Android legacy icons and both adaptive icons are generated from it.
def hodosArtworkDir = file('../../public')
def hodosGeneratedRes = layout.buildDirectory.dir('generated/hodos/res')
android.sourceSets.main.res.srcDir(hodosGeneratedRes.get().asFile)

tasks.register('prepareHodosArtwork') {
    def master = new File(hodosArtworkDir, 'hodos-icon.png')
    inputs.file(master)
    outputs.dir(hodosGeneratedRes)
    doLast {
        if (!master.isFile() || master.length() < 5000) {
            throw new GradleException('Missing full-resolution Hodos icon: apps/web/public/hodos-icon.png')
        }
        def original = javax.imageio.ImageIO.read(master)
        if (original == null || original.width < 1024 || original.height < 1024 ||
            original.width != original.height) {
            throw new GradleException('Hodos master icon must be a square PNG of at least 1024px.')
        }

        def resRoot = hodosGeneratedRes.get().asFile
        def drawable = new File(resRoot, 'drawable-nodpi')
        drawable.mkdirs()
        new File(drawable, 'hodos_brand_icon.png').bytes = master.bytes

        // Pre-Android 8 launchers use identical artwork, whether the launcher
        // selects the standard or legacy round icon entry.
        [mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192].each { density, px ->
            def output = new File(resRoot, 'mipmap-' + density)
            output.mkdirs()
            def image = new java.awt.image.BufferedImage(px, px,
                java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = image.createGraphics()
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            graphics.drawImage(original, 0, 0, px, px, null)
            graphics.dispose()
            ['ic_launcher.png', 'ic_launcher_round.png'].each { fileName ->
                javax.imageio.ImageIO.write(image, 'png', new File(output, fileName))
            }
        }

        // Android adaptive icons crop/mask the foreground to the phone's icon
        // shape. Draw full-bleed across the 432x432 adaptive canvas so the
        // warm golden-hour sky and hills fill every launcher mask cleanly.
        def side = 432
        def foreground = new java.awt.image.BufferedImage(side, side,
            java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = foreground.createGraphics()
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
            java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
            java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        graphics.drawImage(original, 0, 0, side, side, null)
        graphics.dispose()
        javax.imageio.ImageIO.write(foreground, 'png',
            new File(drawable, 'hodos_launcher_foreground.png'))
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareHodosArtwork')
}
