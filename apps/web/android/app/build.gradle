plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    signingConfigs {
        release {
            def keystorePath = System.getenv('HODOS_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('HODOS_STORE_PASSWORD')
                keyAlias System.getenv('HODOS_KEY_ALIAS')
                keyPassword System.getenv('HODOS_KEY_PASSWORD')
            }
        }
    }
    namespace 'org.hodos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.hodos.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            if (System.getenv('HODOS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // 12.x uses the mature OpenGL renderer; pin for older-phone compatibility.
    implementation 'org.maplibre.gl:android-sdk:12.3.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}

// Never ship the previously truncated JPEG/PNG thumbnails as Hodos artwork.
// The website's ORIGINAL PNGs are the single authoritative brand source.
// This task runs for local builds and GitHub Actions alike.
def hodosArtworkDir = file('../../public')
def hodosGeneratedRes = layout.buildDirectory.dir('generated/hodos/res')
android.sourceSets.main.res.srcDir(hodosGeneratedRes.get().asFile)

tasks.register('prepareHodosArtwork') {
    def originals = [
        'hodos-icon.png': 'hodos_icon_square.png',
        'hodos-round.png': 'hodos_icon_round.png',
        'hodos-wordmark.png': 'hodos_wordmark.png'
    ]
    inputs.files(originals.keySet().collect { new File(hodosArtworkDir, it) })
    outputs.dir(hodosGeneratedRes)
    doLast {
        def target = new File(hodosGeneratedRes.get().asFile, 'drawable-nodpi')
        target.mkdirs()
        originals.each { originalName, packagedName ->
            def source = new File(hodosArtworkDir, originalName)
            if (!source.isFile() || source.length() < 50000) {
                throw new GradleException(
                    "Original Hodos artwork missing or too small: apps/web/public/" +
                    originalName + ". Upload the full-resolution PNG first."
                )
            }
            new File(target, packagedName).bytes = source.bytes
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareHodosArtwork')
}
