plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    signingConfigs {
        release {
            def keystorePath = System.getenv('HODOS_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('HODOS_STORE_PASSWORD')
                keyAlias System.getenv('HODOS_KEY_ALIAS')
                keyPassword System.getenv('HODOS_KEY_PASSWORD')
            }
        }
    }
    namespace 'org.hodos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.hodos.app'
        minSdk 23
        targetSdk 35
        versionCode 26
        versionName '1.1.24'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            if (System.getenv('HODOS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // OS-managed, network-constrained retries outlive the sensor service.
    implementation 'androidx.work:work-runtime:2.9.1'
    // 12.x uses the mature OpenGL renderer; pin for older-phone compatibility.
    implementation 'org.maplibre.gl:android-sdk:12.3.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// One source of truth for the identity: deliberate cartographic road geometry.
// The mark is drawn with Java2D at build time, keeping the APK independent from
// externally generated PNGs and producing sharp density-specific raster icons.
def hodosGeneratedRes = layout.buildDirectory.dir('generated/hodos/res')
android.sourceSets.main.res.srcDir(hodosGeneratedRes.get().asFile)

tasks.register('prepareHodosArtwork') {
    inputs.property('roadMarkRevision', '2026-10-cartographic-1')
    outputs.dir(hodosGeneratedRes)
    doLast {
        def root = hodosGeneratedRes.get().asFile
        def render = { int px, double insetRatio ->
            def image = new java.awt.image.BufferedImage(px, px,
                java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = image.createGraphics()
            try {
                g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                    java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                g.setRenderingHint(java.awt.RenderingHints.KEY_STROKE_CONTROL,
                    java.awt.RenderingHints.VALUE_STROKE_PURE)
                double inset = px * insetRatio
                double side = px - inset * 2d
                def background = new java.awt.geom.RoundRectangle2D.Double(
                    inset, inset, side, side, side * .46d, side * .46d)
                g.setColor(new java.awt.Color(25, 61, 50))
                g.fill(background)

                def route = new java.awt.geom.Path2D.Double()
                route.moveTo(inset + side * .24d, inset + side * .84d)
                route.curveTo(inset + side * .28d, inset + side * .66d,
                    inset + side * .59d, inset + side * .68d,
                    inset + side * .65d, inset + side * .51d)
                route.curveTo(inset + side * .71d, inset + side * .34d,
                    inset + side * .61d, inset + side * .21d,
                    inset + side * .77d, inset + side * .17d)
                g.setStroke(new java.awt.BasicStroke((float)(side * .23d),
                    java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
                g.setColor(new java.awt.Color(244, 240, 223))
                g.draw(route)
                if (side > 30d) {
                    g.setStroke(new java.awt.BasicStroke((float)(side * .027d),
                        java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND,
                        10f, [(float)(side * .05d), (float)(side * .08d)] as float[], 0f))
                    g.setColor(new java.awt.Color(25, 61, 50))
                    g.draw(route)
                }
                g.setColor(new java.awt.Color(228, 156, 100))
                g.fill(new java.awt.geom.Ellipse2D.Double(
                    inset + side * .75d - side * .08d,
                    inset + side * .19d - side * .08d, side * .16d, side * .16d))
            } finally {
                g.dispose()
            }
            image
        }
        def drawable = new File(root, 'drawable-nodpi')
        drawable.mkdirs()
        javax.imageio.ImageIO.write(render(1024, 0d), 'png',
            new File(drawable, 'hodos_brand_icon.png'))
        [mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192].each { density, px ->
            def out = new File(root, 'mipmap-' + density)
            out.mkdirs()
            def art = render(px as int, 0d)
            ['ic_launcher.png','ic_launcher_round.png'].each { filename ->
                javax.imageio.ImageIO.write(art, 'png', new File(out, filename))
            }
        }
        javax.imageio.ImageIO.write(render(432, .12d), 'png',
            new File(drawable, 'hodos_launcher_foreground.png'))
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareHodosArtwork')
}
